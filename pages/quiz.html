<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>CO2 Quiz</title>
  <link href="../manifest.webmanifest" rel="manifest"/>
  <meta content="#74a974" name="theme-color"/>
  <meta content="yes" name="apple-mobile-web-app-capable"/>
  <link href="../assets/icons/icon-192.png" rel="apple-touch-icon"/>
  
  <script src="../js/version.js"></script>

  <script>
    function loadAsset(type, path) {
      var v = (typeof APP_BUILD !== 'undefined') ? APP_BUILD : Date.now();
      if (type === 'css') {
        document.write('<link rel="stylesheet" href="' + path + '?v=' + v + '">');
      } else if (type === 'js') {
        document.write('<script src="' + path + '?v=' + v + '"><\/script>');
      }
    }
    
    // Φόρτωση CSS
    loadAsset('css', '../styles.css');
  </script>
</head>
<body>
  <div class="container">
    <div class="panel" id="mainPanel">
      <div class="topbar">
        <button aria-label="Menu" class="iconBtn" id="menuBtn"><span class="hamburger"><span></span></span></button>
        <div class="topbarSpacer"></div>
      </div>
    </div>

    <div class="card quizShell">
      <div class="statsBar">
        <div id="qLabel" class="statPill"></div>
        <div id="scoreLabel" class="statPill"></div>
      </div>

      <div class="quizNavTop">
        <button class="pillBtn quizNavBtn" id="btnPrev" aria-label="Previous">◀</button>
        <div class="quizNavMid" id="navMid"></div>
        <button class="pillBtn quizNavBtn" id="btnNext" aria-label="Next">▶</button>
      </div>

      <div class="card quizCard">
        <div class="quizHeaderBanner" aria-hidden="true">
          <svg class="quizBannerSvg" viewBox="0 0 500 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="ecoBannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#74a974" stop-opacity="0.35"/>
                <stop offset="50%" stop-color="#4caf50" stop-opacity="0.25"/>
                <stop offset="100%" stop-color="#2e8b57" stop-opacity="0.35"/>
              </linearGradient>
            </defs>
            <path d="M0,32 C120,50 200,15 320,38 C420,54 460,20 500,28 L500,0 L0,0 Z" fill="url(#ecoBannerGrad)"/>
            <path d="M0,18 C140,36 240,6 360,28 C430,42 470,16 500,20 L500,0 L0,0 Z" fill="url(#ecoBannerGrad)" opacity="0.6"/>
          </svg>
          <div class="quizBannerBadge">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" stroke="#2e8b57" stroke-width="1.8" fill="rgba(255,255,255,0.9)"/>
              <path d="M16 11c1-2 3.5-3 5-3 0 2-1 4-3 5" stroke="#4caf50" stroke-width="2" fill="none"/>
            </svg>
          </div>
        </div>
        <div class="questionText" id="question"></div>
        <div class="optionsContainer" id="optionsContainer">
          <button class="optionCard" id="optCard1" data-choice="1">
            <span class="optBadge" id="badge1">A</span>
            <span class="optionText" id="opt1"></span>
          </button>
          <button class="optionCard" id="optCard2" data-choice="2">
            <span class="optBadge" id="badge2">B</span>
            <span class="optionText" id="opt2"></span>
          </button>
          <button class="optionCard" id="optCard3" data-choice="3">
            <span class="optBadge" id="badge3">Γ</span>
            <span class="optionText" id="opt3"></span>
          </button>
        </div>
        <div class="hint" id="hint"></div>
      </div>

      <div class="choicesRow" id="choicesRow" style="display:none;">
        <button class="choiceBtn" data-choice="1">A</button>
        <button class="choiceBtn" data-choice="2">B</button>
        <button class="choiceBtn" data-choice="3">Γ</button>
      </div>

      <div class="answerCard" id="answerCard" style="display:none;">
        <div class="answerHead">
          <div id="answerTitle" class="answerTitle"></div>
          <button class="iconBtn answerClose" id="btnAnswerClose" aria-label="Close">×</button>
        </div>
        <div class="explain" id="answerExplain"></div>
        <div class="small" id="answerSource" style="margin-top:10px;"></div>
      </div>
    </div>
  </div>

  <script>
    loadAsset('js', '../js/common.js');
    loadAsset('js', '../js/menu.js');
    loadAsset('js', '../js/quiz.js');
  </script>

  <div id="versionDisplay" style="text-align:center; font-size:0.85rem; color:#888; margin-top:2rem; margin-bottom:1rem; opacity:0.7;"></div>

  <script>
    if (document.getElementById('versionDisplay') && typeof APP_VER !== 'undefined') {
      document.getElementById('versionDisplay').innerText = 'v' + APP_VER;
    }
  </script>

  <div aria-hidden="true" class="drawerBackdrop" id="drawerBackdrop"></div>
  <nav aria-hidden="true" class="drawer" id="drawer">
    <div class="drawerHeader">
      <div class="drawerTitle">CO2app</div>
      <button aria-label="Close menu" class="iconBtn" id="drawerClose">×</button>
    </div>
    <div class="drawerSection" id="drawerNav"></div>
    <div class="drawerSection" id="drawerLang"></div>
  </nav>
</body>
</html>
